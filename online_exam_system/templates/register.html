{% extends "base.html" %}

{% block title %}Create Account - Online Exam System{% endblock %}

{% block content %}
<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-md-7 col-lg-6">
      <div class="card shadow-sm p-4">
        <div class="text-center mb-4">
          <div class="d-inline-flex align-items-center justify-content-center bg-warning bg-opacity-10 text-warning rounded-circle mb-2" style="width: 56px; height: 56px;">
            <i class="fas fa-user-plus fs-4 text-warning"></i>
          </div>
          <h3 class="fw-bold">Create Account</h3>
          <p class="text-muted small">Register to start taking online assessments</p>
        </div>

        <form method="POST" action="{{ url_for('register') }}">
          <div class="row g-3 mb-3">
            <div class="col-md-6">
              <label for="full_name" class="form-label fw-semibold">Full Name</label>
              <input type="text" class="form-control" id="full_name" name="full_name" required placeholder="John Doe">
            </div>
            <div class="col-md-6">
              <label for="username" class="form-label fw-semibold">Username</label>
              <input type="text" class="form-control" id="username" name="username" required placeholder="johndoe">
            </div>
          </div>

          <div class="mb-3">
            <label for="email" class="form-label fw-semibold">Email Address</label>
            <div class="input-group">
              <span class="input-group-text"><i class="fas fa-envelope"></i></span>
              <input type="email" class="form-control" id="email" name="email" required placeholder="john@example.com">
            </div>
          </div>

          <div class="row g-3 mb-4">
            <div class="col-md-6">
              <label for="password" class="form-label fw-semibold">Password</label>
              <input type="password" class="form-control" id="password" name="password" minlength="4" required placeholder="••••••••">
            </div>
            <div class="col-md-6">
              <label for="confirm_password" class="form-label fw-semibold">Confirm Password</label>
              <input type="password" class="form-control" id="confirm_password" name="confirm_password" minlength="4" required placeholder="••••••••">
            </div>
          </div>

          <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
            <i class="fas fa-user-check me-2"></i> Register Account
          </button>
        </form>

        <div class="text-center mt-4">
          <span class="text-muted small">Already have an account? </span>
          <a href="{{ url_for('login') }}" class="fw-semibold text-primary">Log In</a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
